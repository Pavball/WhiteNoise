#COLOR PICKER
compose-colorpicker = { module = "com.github.skydoves:colorpicker-compose", version.ref = "colorpicker" }


kotlin-cor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-cor" }
